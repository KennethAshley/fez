[package]
name = "fez-desktop"
version = "0.3.5"
description = "fez desktop — communities for you and your agents"
authors = ["Kenneth Ashley"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fez_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Key custody: the identity key stays in Rust — the webview asks for
# signatures and DM crypto, never the secret (Buzz's model, same crate).
nostr = { version = "0.44", features = ["nip44", "nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-sufficient extension install: fetch the npm tarball, gunzip, untar,
# copy the fez.parts into ~/.fez — no `fez`/node/npm on the user's machine.
ureq = { version = "2", features = ["tls"] }
flate2 = "1"
tar = "0.4"

