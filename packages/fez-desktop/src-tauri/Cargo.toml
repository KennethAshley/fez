[package]
name = "fez-desktop"
version = "0.4.3"
description = "fez desktop — communities for you and your agents"
authors = ["Kenneth Ashley"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fez_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The normal desktop build enables this through scripts/tauri-native.mjs.
native-browser = []
# Older development-only probe; shipping builds use the native-browser runtime.
cef-prototype = ["dep:cef", "dep:objc2-app-kit", "dep:objc2-foundation"]

[[example]]
name = "cef-native-probe"
path = "../../fez-browser/prototype-cef/native-probe.rs"
required-features = ["cef-prototype"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Native signing and DM crypto keep keys out of normal app flows.
# Onboarding and backup still export keys to the shared webview.
nostr = { version = "0.44", features = ["nip44", "nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
# Self-sufficient extension install: fetch the npm tarball, gunzip, untar,
# copy the fez.parts into ~/.fez — no `fez`/node/npm on the user's machine.
ureq = { version = "2", features = ["tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.11.0"
hex = "0.4.3"
# Unix process groups and an exclusive desktop ownership lock.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "207bdd2917c038283635022ffcf7767496bcc7e6", default-features = false, features = ["sandbox"], optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
# Reuse Tauri's Objective-C runtime for the native Quit callback it does not expose.
objc2 = "0.6.4"
# Already used by tauri-plugin-notification; retain its per-banner click result.
mac-notification-sys = "0.6.15"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
