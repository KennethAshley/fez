# Fez CI — build the workspace chain, then run the full eval/test gate.
# The live routing eval (routing.live.test.ts) loud-skips when no router
# endpoint is reachable, so the suite is CI-safe by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest # node:sqlite + keychain-adjacent paths match the dev platform
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Every package, not a hand-kept list. The list said eight, while
      # the eval suite imports from fez-kanban, fez-github and
      # fez-desktop too — so those suites failed on a missing module and
      # had been failing for as long as the list was stale. A list you
      # maintain by hand drifts the first time someone adds a package.
      - name: Install (root + every package)
        run: |
          npm install
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] && npm install --prefix "$dir"
          done

      # Before the build, because neither linter needs one and a failure
      # here is cheap to read. Both are at zero — the point is the fourth
      # .rail block failing on arrival rather than costing an afternoon
      # of hover tests to find.
      - name: Lint gate
        run: npm run lint

      # The first four are ordered by hand because they must be: the root
      # tsc type-checks src/tui.ts, which imports fez-client's dist, so
      # fez-client builds FIRST; fez-tui precedes it (its d.ts feeds the
      # root); build:core is the root alone. Then `npm run build` walks
      # packages/ for everything else, so a new package is covered the
      # day it has a build script.
      - name: Build
        run: |
          npm run build --prefix packages/fez-tui
          npm run build --prefix packages/fez-relay
          npm run build --prefix packages/fez-client
          npm run build:core
          npm run build

      - name: Test gate
        run: npx vitest --run
        working-directory: packages/fez-evals
