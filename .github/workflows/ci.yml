# Fez CI — build the workspace chain, then run the full eval/test gate.
# The live routing eval (routing.live.test.ts) loud-skips when no router
# endpoint is reachable, so the suite is CI-safe by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu, deliberately: macOS runners bill at 10x and burned the whole
    # free tier in under a month, while nothing in the suite is actually
    # darwin-only — node:sqlite is cross-platform on node 24, and the one
    # keychain-adjacent test (command-risk) classifies a command STRING
    # without running it. Anything genuinely darwin-only that arrives
    # later gets a process.platform guard, not a 10x runner. Release
    # stays on macOS (release.yml) — signing and notarization need it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Every package, not a hand-kept list. The list said eight, while
      # the eval suite imports from fez-kanban, fez-github and
      # fez-desktop too — so those suites failed on a missing module and
      # had been failing for as long as the list was stale. A list you
      # maintain by hand drifts the first time someone adds a package.
      - name: Install (root + every package)
        run: |
          npm install
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] && npm install --prefix "$dir"
          done

      # Before the build, because neither linter needs one and a failure
      # here is cheap to read. Both are at zero — the point is the fourth
      # .rail block failing on arrival rather than costing an afternoon
      # of hover tests to find.
      - name: Lint gate
        run: npm run lint

      # One recipe for CI and fresh clones alike: build-all.mjs owns the
      # bootstrap order (fez-tui/relay/client before core — the root tsc
      # imports their dists), which used to live only in this file. When
      # the order was YAML-only, GitHub could build from nothing and a
      # fresh local checkout could not.
      - name: Build
        run: npm run build

      - name: Test gate
        run: npx vitest --run
        working-directory: packages/fez-evals
