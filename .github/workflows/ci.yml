# Fez CI — build the workspace chain, then run the full eval/test gate.
# The live routing eval (routing.live.test.ts) loud-skips when no router
# endpoint is reachable, so the suite is CI-safe by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest # node:sqlite + keychain-adjacent paths match the dev platform
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (root + tested packages)
        run: |
          npm install
          for pkg in fez-tui fez-relay fez-client fez-acp fez-communities fez-workflows fez-media fez-evals; do
            npm install --prefix "packages/$pkg"
          done

      # Before the build, because neither linter needs one and a failure
      # here is cheap to read. Both are at zero — the point is the fourth
      # .rail block failing on arrival rather than costing an afternoon
      # of hover tests to find.
      - name: Lint gate
        run: npm run lint

      # Order matters: the root tsc type-checks src/tui.ts which imports
      # fez-client's dist, so fez-client (pure tsc, no root dependency)
      # must build FIRST. fez-tui must precede fez-client (its d.ts feeds
      # the root), and fez-relay before evals.
      - name: Build
        run: |
          npm run build --prefix packages/fez-tui
          npm run build --prefix packages/fez-relay
          npm run build --prefix packages/fez-client
          npm run build
          npm run build --prefix packages/fez-acp
          npm run build --prefix packages/fez-communities
          npm run build --prefix packages/fez-workflows
          npm run build --prefix packages/fez-media

      - name: Test gate
        run: npx vitest --run
        working-directory: packages/fez-evals
