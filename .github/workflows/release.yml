# Release: push a tag `v*` and this produces the same artifact set
# scripts/release.sh makes locally — signed, notarized, stapled DMG +
# updater archive + latest.json — published to the public downloads repo.
# Source checkout, build logs, and signing secrets stay in this private repo.
#
# Secrets (gh secret set …):
#   APPLE_CERT_P12        base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD   the .p12's password
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   TAURI_SIGNING_PRIVATE_KEY   the updater minisign key
#   FEZ_RELEASES_TOKEN         contents:write on KennethAshley/fez-releases only
#
# The bundled agent (pi/pi-acp/fez-relay) is SEEDED from the
# pi-agent-v<ver> prerelease, not built from source: upstream pi ships
# no bun lockfile, so fresh-cache source builds drift and fail
# (found the hard way). Refresh the seed from a dev machine via
# prepare-pi-agent.mjs + upload an asset named for its full VERSION.
name: release
on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release-macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check public publishing credential
        env:
          FEZ_RELEASES_TOKEN: ${{ secrets.FEZ_RELEASES_TOKEN }}
        run: test -n "$FEZ_RELEASES_TOKEN" || { echo "Set FEZ_RELEASES_TOKEN with Contents write access to fez-releases."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Root install alone is not enough: the cross-package deps are
      # `file:` links, and without a per-package install the @fezchat/*
      # symlinks never exist — fez-relay's tsc dies on TS2307 and
      # fez-elevenlabs cannot bundle @fezchat/media. ci.yml has always
      # installed per package; this job did not, so it could never have
      # built the workspace it is meant to release. Same recipe, both
      # places. `npm install` (not ci) per package, because not every
      # package carries a lockfile.
      - name: Build workspace (core + packages)
        run: |
          npm ci
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] && npm install --prefix "$dir"
          done
          npm run build

      - name: Desktop deps
        run: npm ci
        working-directory: packages/fez-desktop

      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm /tmp/cert.p12

      - name: Seed bundled agent from cache release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PI_VER=$(grep -m1 'const PI_VERSION' packages/fez-desktop/scripts/prepare-pi-agent.mjs | sed 's/.*"\(.*\)".*/\1/')
          WANT_VER=$(node -p "const s=require('fs').readFileSync('packages/fez-desktop/scripts/prepare-pi-agent.mjs','utf8'); const pi=s.match(/const PI_VERSION = \"([^\"]+)\"/)[1]; const svc=s.match(/PI_VERSION\}\+(svc\d+)/)[1]; pi+'+'+svc")
          ASSET="pi-agent-macos-arm64-${WANT_VER}.tar.gz"
          gh release download "pi-agent-v${PI_VER}" --pattern "$ASSET" --output /tmp/pi-agent.tar.gz
          tar -xzf /tmp/pi-agent.tar.gz -C packages/fez-desktop/src-tauri
          test -x packages/fez-desktop/src-tauri/pi-agent/pi
          test -x packages/fez-desktop/src-tauri/pi-agent/fez-relay
          # The seed's identity must match the source constant, or the
          # runner (no bun by design — see header) dies mid-release, or
          # worse ships stale binaries under a fresh marker. Fail HERE,
          # with the fix in the message. (v0.4.24's first run died on
          # exactly this: seed at +svc9, source at +svc10.)
          SEED_VER=$(cat packages/fez-desktop/src-tauri/pi-agent/VERSION)
          [ "$SEED_VER" = "$WANT_VER" ] || { echo "✗ seed pi-agent is $SEED_VER but source wants $WANT_VER — rebuild and upload $ASSET to pi-agent-v${PI_VER}"; exit 1; }
          echo "seeded pi-agent $SEED_VER"

      - name: Tag must match the version being built
        run: |
          VERSION=$(node -p "require('./packages/fez-desktop/src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }

      - name: Build, sign, notarize, publish
        env:
          GH_TOKEN: ${{ secrets.FEZ_RELEASES_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          REQUIRE_PI_AGENT: "1"
        run: bash packages/fez-desktop/scripts/release.sh
